# Build and test the GUI on the three desktop platforms it targets. The
# simulator itself is not needed: the tests that drive it through Docker are
# #[ignore]d and run locally (see gui/src/e2e.rs).
name: gui

on:
  push:
    paths: ["gui/**", "results/**", ".github/workflows/gui.yml"]
  pull_request:
    paths: ["gui/**", "results/**", ".github/workflows/gui.yml"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui
      - name: Linux windowing headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: hetero-gui-${{ runner.os }}
          path: |
            gui/target/release/hetero-gui
            gui/target/release/hetero-gui.exe
          if-no-files-found: error
